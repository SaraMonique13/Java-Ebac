<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrossel de imagens</title>
    <link rel="stylesheet" href="lib/bootstrap.min.css">
    <style>
        img{
            height: 635px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="carousel-exemplo" class="carousel carousel-fade slide" data-bs-ride="carousel">
            <div class="carousel-inner">
                <div  class="carousel-item active" data-bs-interval="3000">
                    <img class="d-block w-100" src="imagens/img1.jpg" alt="">
                    <div class="carousel-caption">
                        <h2>Imagem da cidade de Paris</h2>
                    </div>
                </div>
                <div  class="carousel-item" data-bs-interval="3000">
                    <img class="d-block w-100" src="imagens/img2.jpg" alt="">
                    <div class="carousel-caption">
                        <h2>Imagem de um parque em Paris</h2>
                    </div>
                </div>
                <div  class="carousel-item" data-bs-interval="3000">
                    <img class="d-block w-100" src="imagens/img3.jpg" alt="">
                    <div class="carousel-caption">
                        <h2>Imagem do Louvre</h2>
                    </div>
                </div>
            </div>
            <button type="button" class="carousel-control-prev" data-bs-target="#carousel-exemplo" data-bs-slide="prev">
                <span class="carousel-control-prev-icon"></span>
            </button>
            <button type="button" class="carousel-control-next" data-bs-target="#carousel-exemplo" data-bs-slide="next">
                <span class="carousel-control-next-icon"></span>
            </button>
            <div class="carousel-indicators">
                <button type="button" data-bs-target="#carousel-exemplo" data-bs-slide-to="0" class="active"></button>
                <button type="button" data-bs-target="#carousel-exemplo" data-bs-slide-to="1"></button>
                <button type="button" data-bs-target="#carousel-exemplo" data-bs-slide-to="2"></button>
            </div>
        
        </div>
    </div>
    <script src="lib/bootstrap.bundle.min.js"></script>
</body>
</html>
